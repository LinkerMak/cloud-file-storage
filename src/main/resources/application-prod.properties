spring.config.import=optional:file:.env[.properties]

server.port=${SERVER_PORT}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=${DB_DRIVER}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO}
spring.jpa.properties.hibernate.dialect=${JPA_DIALECT}
spring.jpa.show-sql=${JPA_SHOW_SQL}
spring.jpa.open-in-view=${JPA_OPEN_IN_VIEW}

spring.flyway.enabled=${FLYWAY_ENABLED}

spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}

spring.redis.session.ttl-seconds=${SESSION_TTL_SECONDS}
spring.redis.session.ttl-refresh-threshold-seconds=${SESSION_TTL_REFRESH_THRESHOLD_SECONDS}
spring.redis.session.session-cookie-name=${SESSION_COOKIE_NAME}

server.tomcat.max-swallow-size=${TOMCAT_MAX_SWALLOW_SIZE}
server.tomcat.max-part-count=${TOMCAT_MAX_PART_COUNT}
server.tomcat.max-http-form-post-size=${TOMCAT_MAX_HTTP_FORM_POST_SIZE}

spring.servlet.multipart.enabled=${MULTIPART_ENABLED}
spring.servlet.multipart.max-file-size=${MULTIPART_MAX_FILE_SIZE}
spring.servlet.multipart.max-request-size=${MULTIPART_MAX_REQUEST_SIZE}

spring.minio.url=${MINIO_URL}
spring.minio.access-key=${MINIO_ACCESS_KEY}
spring.minio.secret-key=${MINIO_SECRET_KEY}
spring.minio.bucket=${MINIO_BUCKET}

springdoc.swagger-ui.enabled = ${SWAGGER_ENABLED}
springdoc.api-docs.enabled=${OPEN_API_ENABLED}

